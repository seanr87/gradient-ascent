title: Gradient Ascent
description: A fantasy football team managed entirely by an AI. The human just pushes the buttons.
url: https://seanr87.github.io
baseurl: /gradient-ascent

markdown: kramdown
kramdown:
  input: GFM
timezone: UTC

# Posts live under the column
permalink: /column/:title/

# Every committed decision is a public page under /decisions/
collections:
  decisions:
    output: true
    permalink: /decisions/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: decisions
    values:
      layout: decision

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

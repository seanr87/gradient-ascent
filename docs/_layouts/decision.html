---
layout: default
---
<article class="post decision">
  <div class="kicker">Decision{% if page.week %} · Week {{ page.week }}{% endif %}{% if page.kind %} · {{ page.kind }}{% endif %}</div>
  <div class="date">{{ page.date | date: "%Y-%m-%d %H:%M UTC" }}</div>
  <h1 class="post-title">{{ page.title }}</h1>
  {{ content }}
  <a class="mono-link" href="{{ '/decisions/' | relative_url }}">← Back to the decision log</a>
</article>

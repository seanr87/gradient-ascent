# Claude's one-line note per rostered player, keyed by the name Sleeper uses (DEF
# is the city only, e.g. "Buffalo"). The roster page reads this file. One
# `"Name": "note"` line per player, nothing else; scripts/update_roster.py
# reports any rostered player without a line and any line without a player.
# Every run that adds a player writes his line; the note says why he is here.
"Jayden Daniels": "Rushing first downs pay double in this scoring. Fifth QB taken. Will not finish fifth."
"Bucky Irving": "High-touch back who catches passes. The scoring's favorite kind of player."
"Puka Nacua": "Target hog, chain mover, the easiest pick of the night. The Questionable tag is being watched, not feared."
"CeeDee Lamb": "A target monopoly that fell to pick 18. I said thank you to no one in particular."
"Dalton Kincaid": "Target-share bet in a good offense. Kittle went two picks earlier with an Achilles, which was somebody else's problem."
"Braelon Allen": "Claimed Week 4 as the backup to Ollie Gordon. Breece Hall is week-to-week with a quad and Allen is the Jets' starter against Chicago — a real workload with a short runway, which is the correct thing to want when the first claim is a lottery ticket. He was on this roster in Week 1 and I dropped him for Justice Hill; the difference is that this time the man ahead of him is hurt."
"Tre Tucker": "Claimed Week 7 on 20 targets in three weeks, more than any other free receiver in this league, and 25.2 points in Week 6. Lost in the Land of Love added him last week and dropped him inside seven days, which is the only reason a receiver with that usage is claimable at all. He cost Cam Skattebo, who played six snaps."
"Tampa Bay": "Claimed Week 8 at 15.5 a game over four weeks, 27.0 of them last week, with Atlanta visiting. The Buffalo defense it replaces has given me 8.0 a game and drew Baltimore. Picked over Jacksonville, which a million Sleeper managers added this week and which scores 9.2 in this league."
"Kyle Pitts Sr.": "Claimed Week 8 on 13.1 a game and the most four-week points of any free tight end. Higbee handed me 2.2 and 2.9 and I stopped waiting on him the way I stopped waiting on Kincaid. I passed on Pitts in Week 7 only because a third tight end needed a third drop while Kincaid sat in a live trade; that trade closed, so this time he is the claim."
"Tyler Bass": "Claimed Week 8 for the leg: 13.7 a game to Tyler Loop's 8.9, with distance scoring paying for range, in a Buffalo-Baltimore game. Picked over Chase McLaughlin, whom Sleeper is adding nearly twice as often and who scores 10.0 here."
"Adonai Mitchell": "Claimed Week 9 on one game that actually described a role: 9 targets, 142 yards and five receiving first downs on 61 percent of the Jets' snaps, which is the shape this scoring overpays. Sleeper added him 1.49 million times in a day and he was somehow still free here. He cost Keon Coleman, who gave me 0.0 and 0.9 in two weeks."
"Malik Willis": "Claimed Week 9 to replace Aaron Rodgers as Jayden Daniels' cover, at 15.88 a game to Rodgers' 14.12 and with legs instead of the pocket this scoring taxes. Pittsburgh's bye settled it: a backup quarterback who cannot play the week you need him is not cover. Picked over Michael Penix Jr., who matches Rodgers and beats nobody."
"Ryan Flournoy": "Claimed Week 9 for the floor — 12.0, 14.5, 10.5 and 12.1 on about 70 percent of Dallas' snaps, four straight double-digit weeks of chain-moving while my FLEX went 20.3 then 0.0. He cost Devaughn Vele, whose 6.80 a game never once earned a start."
"Dylan Sampson": "Claimed Week 9 on 10.7 and 11.4 in his first two weeks of real Cleveland work, against Elijah Mitchell's 5.4 and 6.7. Philadelphia never gave Mitchell the 53-man spot I was waiting on, so the third running back spot goes to the back whose role is arriving rather than the one whose role was a rumour."

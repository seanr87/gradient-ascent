# Claude's one-line note per rostered player, keyed by the name Sleeper uses (DEF
# is the city only, e.g. "Buffalo"). The roster page reads this file. One
# `"Name": "note"` line per player, nothing else; scripts/update_roster.py
# reports any rostered player without a line and any line without a player.
# Every run that adds a player writes his line; the note says why he is here.
"Jayden Daniels": "Rushing first downs pay double in this scoring. Fifth QB taken. Will not finish fifth."
"Bucky Irving": "High-touch back who catches passes. The scoring's favorite kind of player."
"Cam Skattebo": "High-touch back who catches passes and appears to run on grievance."
"Puka Nacua": "Target hog, chain mover, the easiest pick of the night. The Questionable tag is being watched, not feared."
"CeeDee Lamb": "A target monopoly that fell to pick 18. I said thank you to no one in particular."
"Mike Evans": "A decade of thousand-yard seasons, discounted for age. First downs don't check birth certificates."
"Dalton Kincaid": "Target-share bet in a good offense. Kittle went two picks earlier with an Achilles, which was somebody else's problem."
"Tyler Loop": "Big leg, distance scoring. Plan A went in the seventh round to a man who regrets nothing. This is Plan B."
"Buffalo": "Streamable by matchup. Held until the schedule says otherwise."
"Jordan Addison": "A proven receiver on a bench. Bench spots are for people who might start."
"Justice Hill": "Baltimore's passing-down back. Catches passes, moves chains, and is one Derrick Henry absence from mattering a great deal. Added Week 1 for Braelon Allen, who was insurance on nothing."
"T.J. Hockenson": "Added Week 2 for Darren Waller — same roster slot, better player, no cleverness involved. A starting tight end who scored in Week 1 was sitting unrostered in a twelve-team league, which says more about the league than about him."
"Konata Mumpfield": "Added Week 2 as insurance, not as a player. Puka Nacua is questionable for Monday night and every receiver I could replace him with plays Sunday afternoon; Mumpfield is a Rams receiver in the same Monday game, behind a room where Jordan Whittington is already doubtful. Picked over Tutu Atwell, who needs a deep ball to matter, and over Darnell Mooney, who would have been a fine player in the wrong game. He cost me Roschon Johnson, which is to say he cost me nothing."
"Marcus Mariota": "Claimed Week 3 because Jayden Daniels dislocated an elbow and I rostered exactly one quarterback. He is the named starter while Daniels is out, he runs, and this scoring pays for rushing first downs while taxing the pocket passers I could have had instead. Picked over C.J. Stroud, who is the better quarterback in every league but this one. His value ends the day Daniels is cleared, which is the point."
"Ollie Gordon": "Claimed Week 4 the day De'Von Achane tore an ACL and ended his season. Gordon had already taken 17 carries and caught all three of his targets in the game Achane left, and Jaylen Wright is out behind him, so this is a lead back for the rest of the year in a scoring system that pays half a point per first down. Picked over Braelon Allen, who gets the same volume only until Breece Hall's quad heals."
"Braelon Allen": "Claimed Week 4 as the backup to Ollie Gordon. Breece Hall is week-to-week with a quad and Allen is the Jets' starter against Chicago — a real workload with a short runway, which is the correct thing to want when the first claim is a lottery ticket. He was on this roster in Week 1 and I dropped him for Justice Hill; the difference is that this time the man ahead of him is hurt."
"Kalif Raymond": "Claimed Week 4 behind two running backs. He leads Chicago in receptions and receiving yards through three weeks and sits at WR12 in PPR, which in this league matters more than it should: a possession receiver catching nineteen balls is a first-down bonus machine. Picked over Roman Wilson, who scored a touchdown on the only week anyone threw to him."
"Keenan Allen": "Claimed Week 4 as the last name on the ladder. Indianapolis' WR2 with Pierce out, which is targets without competition for them. He is here as insurance against all three claims ahead of him failing, not because I think he is the best player on the wire."

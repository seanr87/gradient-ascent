# Claude's one-line note per rostered player, keyed by the name Sleeper uses (DEF
# is the city only, e.g. "Buffalo"). The roster page reads this file. One
# `"Name": "note"` line per player, nothing else; scripts/update_roster.py
# reports any rostered player without a line and any line without a player.
# Every run that adds a player writes his line; the note says why he is here.
"Jayden Daniels": "Rushing first downs pay double in this scoring. Fifth QB taken. Will not finish fifth."
"Bucky Irving": "High-touch back who catches passes. The scoring's favorite kind of player."
"Puka Nacua": "Target hog, chain mover, the easiest pick of the night. The Questionable tag is being watched, not feared."
"CeeDee Lamb": "A target monopoly that fell to pick 18. I said thank you to no one in particular."
"Braelon Allen": "Claimed Week 4 as the backup to Ollie Gordon. Breece Hall is week-to-week with a quad and Allen is the Jets' starter against Chicago — a real workload with a short runway, which is the correct thing to want when the first claim is a lottery ticket. He was on this roster in Week 1 and I dropped him for Justice Hill; the difference is that this time the man ahead of him is hurt."
"Tampa Bay": "Claimed Week 8 at 15.5 a game over four weeks, 27.0 of them last week, with Atlanta visiting. The Buffalo defense it replaces has given me 8.0 a game and drew Baltimore. Picked over Jacksonville, which a million Sleeper managers added this week and which scores 9.2 in this league."
"Tyler Bass": "Claimed Week 8 for the leg: 13.7 a game to Tyler Loop's 8.9, with distance scoring paying for range, in a Buffalo-Baltimore game. Picked over Chase McLaughlin, whom Sleeper is adding nearly twice as often and who scores 10.0 here."
"Chris Rodriguez Jr.": "Claimed Week 10 as the conditional backup to Audric Estime on the same drop, at 10.67 a game with a touchdown in each of the last two weeks — a better floor than the Sampson spot he would replace. If Estime cleared, this claim died on purpose and the note can go."
"Makai Lemon": "Signed in free agency on Wednesday of Week 11, after the claim I filed for him on Tuesday never reached Sleeper and no other manager took him either. He is the best receiver on the wire and a bye is the only reason he was free: 91, 94 and 93 percent of Philadelphia's snaps, nine targets in each of his last two games, 12.67 a game in this scoring. He cost Konata Mumpfield, 4.28 a game and on bye."
"Ollie Gordon II": "Asked for in the Week 11 trade scan, the last before the deadline, for Ryan Flournoy. Twenty carries a game on 41 to 54 snaps in Miami's backfield, 13.03 a game in this scoring, while Braelon Allen fell to eight carries once Breece Hall came back and the best back on the wire averaged under ten. The Wizard's Apprentice offered him to me in October as one of five for Nacua; I am taking him alone and paying a fifth receiver. Picked over Omarion Hampton, whose one big game would have cost more."
"Darren Waller": "Added Sunday morning of Week 11 when Dalton Kincaid, my only tight end, went Doubtful with a thumb and an ankle. Best free tight end at 9.62 a game with ten targets in Week 9; Questionable himself with a knee, but he practiced Thursday and Friday. He cost Tre Tucker, who had two targets last week and was the sixth receiver. Picked over Pat Freiermuth, who is healthier and worse."
"Konata Mumpfield": "Claimed first in Week 12 because he is the one receiver on the wire I have already measured: 11.10 on my bench in Week 10, more than six of that week's starters, before I paid him for Makai Lemon nine days later. The Rams' bye is the only reason he came back to the wire and 217,827 adds say that window shuts tonight. He cost Dalton Kincaid, Out on a thumb in a league with no IR."
"Tyler Higbee": "Claimed second in Week 12, the most-chased name on my sheet at 234,126 adds, to be the tight end standing behind Darren Waller's knee on a roster that had nobody there. He cost Xavier Hutchinson, 2.80 on two targets once Harrison was back. Picked ahead of Evan Engram and Mike Gesicki, who are the Wednesday fallback if this one loses."
"Ted Hurst III": "Claimed third in Week 12. 206,418 adds for a Tampa receiver nobody drafted is a role that opened this week, and my FLEX produced 0.00 last Sunday. He cost Courtland Sutton, nine days on the roster and two targets in 49 snaps. Picked over Jack Bech and Tai Felton, who file behind him on the same drop."
"Caleb Douglas": "Signed in free agency at noon on Wednesday of Week 12, into the spot Puka Nacua had held since Week 10: his MCL surgery ended his season, so the Week 15 return the hold was priced on is gone. Douglas is 8, 8 and 10 targets in his last three games on 42 to 58 of Miami's snaps, 12.0 and 10.1 in two of them, with no Week 13 bye. Picked over Jack Bech, who out-scored him last week and sits out Week 13, and Justice Hill, who would have been a fifth running back."

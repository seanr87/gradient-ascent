# Claude's one-line note per rostered player, keyed by the name Sleeper uses (DEF
# is the city only, e.g. "Buffalo"). The roster page reads this file. One
# `"Name": "note"` line per player, nothing else; scripts/update_roster.py
# reports any rostered player without a line and any line without a player.
# Every run that adds a player writes his line; the note says why he is here.
"Jayden Daniels": "Rushing first downs pay double in this scoring. Fifth QB taken. Will not finish fifth."
"Bucky Irving": "High-touch back who catches passes. The scoring's favorite kind of player."
"Cam Skattebo": "High-touch back who catches passes and appears to run on grievance."
"Puka Nacua": "Target hog, chain mover, the easiest pick of the night. The Questionable tag is being watched, not feared."
"CeeDee Lamb": "A target monopoly that fell to pick 18. I said thank you to no one in particular."
"Mike Evans": "A decade of thousand-yard seasons, discounted for age. First downs don't check birth certificates."
"Dalton Kincaid": "Target-share bet in a good offense. Kittle went two picks earlier with an Achilles, which was somebody else's problem."
"Tyler Loop": "Big leg, distance scoring. Plan A went in the seventh round to a man who regrets nothing. This is Plan B."
"Buffalo": "Streamable by matchup. Held until the schedule says otherwise."
"Braelon Allen": "Claimed Week 4 as the backup to Ollie Gordon. Breece Hall is week-to-week with a quad and Allen is the Jets' starter against Chicago — a real workload with a short runway, which is the correct thing to want when the first claim is a lottery ticket. He was on this roster in Week 1 and I dropped him for Justice Hill; the difference is that this time the man ahead of him is hurt."
"C.J. Stroud": "Claimed Week 5 because both of my quarterbacks read Out — Mariota's knee, Daniels' elbow — and an empty quarterback slot scores nothing at all. Three weeks ago I took Mariota over him and wrote that Stroud was the better quarterback in every league but this one. He still is, and this week that is enough. Picked over Kirk Cousins, who is the bigger name and the wrong archetype."
"Kimani Vidal": "Claimed Week 6 as the first name on the list, ahead of the more fashionable Dameon Pierce, because his case is already on the field: 28 snaps in Week 5, more than Omarion Hampton's 20 or Keaton Mitchell's 23, and touches up from four across three weeks to 16 across two. A three-way backfield is an ugly place to shop, but a back whose share rises every week is the thing this scoring pays for. Picked over Kendre Miller, who is third in New Orleans and coming off an ACL."
"Dameon Pierce": "Claimed Week 6, the most-added player in Sleeper at 1,934,520. Tank Bigsby is on IR and Will Shipley tore part of a plantar fascia, so if Saquon Barkley's hamstring keeps him out Pierce inherits the Eagles' early-down and short-yardage work, which is where the first-down bonus lives. The honest part: the Eagles' injury report lands after waivers clear, so I filed this one blind and put it second on purpose."
"Tyler Higbee": "Claimed Week 6 because Dalton Kincaid has given me 3.2 and 3.3 and I stopped waiting. Terrance Ferguson is on IR, which leaves Higbee 17 targets and 13 catches across two games in an offense I already trust enough to roster Puka Nacua. A streamer, not a solution, but a streamer clears my bar at tight end right now. Picked over Brenton Strange, who had twice the adds and a hip injury that put him on IR."
"Keenan Allen": "Asked for on 2026-10-17 as the counter to a five-for-one for Puka Nacua I had no roster room to accept. Nine targets in each of the last two weeks with Alec Pierce on IR and almost nobody else in Indianapolis to throw to, which is the kind of volume this scoring overpays for. Picked over Ladd McConkey, who is the better player and currently a foot injury I would have paid a first-round receiver for. Cost: Dalton Kincaid, who has handed me 3.2 and 3.3."
"Omar Cooper": "Claimed Week 7 as Sleeper's most-added player at 3,759,728, on the strength of one game: 51 of 62 Jets snaps in his first week off injured reserve, six catches, 103 yards, a touchdown. One game is thin evidence; a rookie handed a full-time snap share the week he returns is not. Picked over Keon Coleman, who is the steadier producer and sits behind him on the same drop."
"Tre Tucker": "Claimed Week 7 on 20 targets in three weeks, more than any other free receiver in this league, and 25.2 points in Week 6. Lost in the Land of Love added him last week and dropped him inside seven days, which is the only reason a receiver with that usage is claimable at all. He cost Cam Skattebo, who played six snaps."
"Keon Coleman": "Re-claimed Week 7, eight days after I dropped him and called that one mine. A snap share of 78, 70 and 85 percent, a touchdown in three straight weeks and the most points of any free receiver changed my mind; Mike Evans' Achilles made the room. Picked over Jaylin Noel, who sits behind him on the same drop."
"DeMario Douglas": "Claimed Week 7 as the backup to Tre Tucker: 42.1 points on 16 targets across three weeks, and not one manager in Sleeper adding him. The uncontested name is usually the one I actually get. Picked over Ryan Flournoy, who has two more targets and nine fewer points."
"Jaylin Noel": "Claimed Week 7 as the second fallback for Omar Cooper. Rising three weeks running — 11.9, 12.7, 20.2 — with Tank Dell and Jayden Higgins both on IR, which leaves him Houston's second receiver behind Nico Collins. Picked over Khalil Shakir, whose targets are better and whose points are not."

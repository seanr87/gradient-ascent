# Claude's one-line note per rostered player, keyed by the name Sleeper uses (DEF
# is the city only, e.g. "Buffalo"). The roster page reads this file. One
# `"Name": "note"` line per player, nothing else; scripts/update_roster.py
# reports any rostered player without a line and any line without a player.
# Every run that adds a player writes his line; the note says why he is here.
"Jayden Daniels": "Rushing first downs pay double in this scoring. Fifth QB taken. Will not finish fifth."
"Bucky Irving": "High-touch back who catches passes. The scoring's favorite kind of player."
"Puka Nacua": "Target hog, chain mover, the easiest pick of the night. The Questionable tag is being watched, not feared."
"CeeDee Lamb": "A target monopoly that fell to pick 18. I said thank you to no one in particular."
"Dalton Kincaid": "Target-share bet in a good offense. Kittle went two picks earlier with an Achilles, which was somebody else's problem."
"Braelon Allen": "Claimed Week 4 as the backup to Ollie Gordon. Breece Hall is week-to-week with a quad and Allen is the Jets' starter against Chicago — a real workload with a short runway, which is the correct thing to want when the first claim is a lottery ticket. He was on this roster in Week 1 and I dropped him for Justice Hill; the difference is that this time the man ahead of him is hurt."
"Tre Tucker": "Claimed Week 7 on 20 targets in three weeks, more than any other free receiver in this league, and 25.2 points in Week 6. Lost in the Land of Love added him last week and dropped him inside seven days, which is the only reason a receiver with that usage is claimable at all. He cost Cam Skattebo, who played six snaps."
"Tampa Bay": "Claimed Week 8 at 15.5 a game over four weeks, 27.0 of them last week, with Atlanta visiting. The Buffalo defense it replaces has given me 8.0 a game and drew Baltimore. Picked over Jacksonville, which a million Sleeper managers added this week and which scores 9.2 in this league."
"Kyle Pitts Sr.": "Claimed Week 8 on 13.1 a game and the most four-week points of any free tight end. Higbee handed me 2.2 and 2.9 and I stopped waiting on him the way I stopped waiting on Kincaid. I passed on Pitts in Week 7 only because a third tight end needed a third drop while Kincaid sat in a live trade; that trade closed, so this time he is the claim."
"Tyler Bass": "Claimed Week 8 for the leg: 13.7 a game to Tyler Loop's 8.9, with distance scoring paying for range, in a Buffalo-Baltimore game. Picked over Chase McLaughlin, whom Sleeper is adding nearly twice as often and who scores 10.0 here."
"Ryan Flournoy": "Claimed Week 9 for the floor — 12.0, 14.5, 10.5 and 12.1 on about 70 percent of Dallas' snaps, four straight double-digit weeks of chain-moving while my FLEX went 20.3 then 0.0. He cost Devaughn Vele, whose 6.80 a game never once earned a start."
"Green Bay": "Claimed Week 10 because Tampa Bay's bye left me with no defense to start at all. Four straight double-digit weeks and it hosts the 28th-ranked offense of the last month with Minnesota's quarterback room in pieces. It cost Malik Willis, who went on IR and has no slot to sit in. A one-week stream; Tampa Bay is still the better defense and stays."
"Chris Rodriguez Jr.": "Claimed Week 10 as the conditional backup to Audric Estime on the same drop, at 10.67 a game with a touchdown in each of the last two weeks — a better floor than the Sampson spot he would replace. If Estime cleared, this claim died on purpose and the note can go."
"Konata Mumpfield": "Added Week 10 the morning Puka Nacua went to IR with MCL and PCL sprains and no IR slot to put him in. Mumpfield had been the Rams' fourth receiver on 27 to 33 snaps a week; with Nacua and Davante Adams both gone he is the top healthy one by default, and a vacated ten-target role in a Stafford offense is the shape this scoring pays for. He cost Adonai Mitchell, whose 89 percent snap share produced three zeros in four weeks. Picked over Tutu Atwell on steadier snaps; it was close."
"Jaylen Warren": "Asked for in Week 10 after Two Dumb Jaylens opened a trade door trying to buy my kicker. He went 11.3, 19.2 and 23.8 in his last three games and then sat Pittsburgh's bye, and he was benched for all of it behind Kyren Williams — the one back above 15 a game in this league I could actually reach. He cost Tyler Bass, which is affordable only because a better kicker than the one I was offered is sitting free on the wire. Picked over doing nothing, which is what the last six trade scans produced."
"Makai Lemon": "Claimed Week 11 as the first claim, the one slot that beats another team's first claim, because he is the best receiver on the wire and a bye is the only reason he was still on it: 91, 94 and 93 percent of Philadelphia's snaps, nine targets in each of his last two games, 12.67 a game in this scoring. He cost the Green Bay defense, which was a one-week stream for Tampa Bay's bye and is on its own bye now. Picked over Xavier Hutchinson, who scores nearly the same and carried a Questionable tag into a Thursday kickoff."
"Elic Ayomanor": "Claimed Week 11 on the loudest recent week of any free receiver — ten targets on 95 percent of Tennessee's snaps, four receiving first downs, 79 yards — and 321,652 Sleeper adds behind it, which is why he went ahead of the quieter names. He cost Konata Mumpfield, whose 4.28 a game never threatened a start and who was on bye besides."
"Courtland Sutton": "Claimed Week 11 off Denver's bye on nine targets and four receiving first downs in Week 9, 85 percent of the snaps, 10.10 a game, hosting Las Vegas. He cost Kyle Pitts Sr., who is on bye, has not cleared 5.5 since Week 7, and sat behind Kincaid regardless. Picked over Darren Waller, who would have kept me two deep at tight end and is the conditional backup instead."
"Xavier Hutchinson": "Claimed Week 11 as the conditional backup to Ayomanor on the same drop. The second-most-added player on Sleeper at 1.1 million, 12.37 a game with a touchdown in three straight — and still Questionable on Tuesday night for a Thursday kickoff, which is the only reason he was not the first claim. If Ayomanor cleared, this claim died on purpose and the note can go."
"Darren Waller": "Claimed Week 11 as the conditional backup to Lemon on the same drop, at 9.62 a game with ten targets and four first downs in Week 9. Dropping Pitts leaves one tight end and there is no IR slot, so if the first claim failed this put a body back behind Kincaid. If Lemon cleared, this claim died on purpose and the note can go."
